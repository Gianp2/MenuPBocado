        <path d="M -16 -42 C -16 -12 -12 20 0 20 C 12 20 16 -12 16 -42 C 12 -42 10 -30 8 -18 C 6 -30 5 -42 2 -42 C -1 -42 -2 -30 -4 -18 C -6 -30 -8 -42 -16 -42 Z" />
