        <path d="M -3 20 C -3 58 -4 65 0 68 C 4 65 3 58 3 20 Z" />
        <rect x="-14" y="-40" width="3.2" height="26" rx="1.6" />
        <rect x="-6" y="-40" width="3.2" height="26" rx="1.6" />
        <rect x="2.8" y="-40" width="3.2" height="26" rx="1.6" />
