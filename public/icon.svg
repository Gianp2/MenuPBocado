    <path d="M 104 380 A 176 176 0 0 0 396 380 L 412 404 A 200 200 0 0 1 88 404 Z" fill="#708044" opacity="0.8" />
    <path d="M 92 396 A 192 192 0 0 0 408 396 L 436 430 A 224 224 0 0 1 64 430 Z" fill="#c65526" />

