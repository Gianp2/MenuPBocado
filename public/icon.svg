    <text x="250" y="354" text-anchor="middle" fill="#6e2814" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14.5" letter-spacing="1.2">DESAYUNOS • VIANDAS • COMIDAS • CAFÉ</text>
